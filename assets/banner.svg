<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .tag {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #818cf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .grid-line {
      stroke: #334155;
      stroke-width: 1;
      opacity: 0.25;
    }
    .chart-line {
      fill: none;
      stroke: url(#accentGrad);
      stroke-width: 4;
      stroke-linecap: round;
      filter: url(#glow);
    }
    .pulse-circle {
      fill: #ec4899;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { r: 6px; opacity: 1; }
      50% { r: 12px; opacity: 0.4; }
      100% { r: 6px; opacity: 1; }
    }
    @keyframes floatWave {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .animated-wave {
      animation: floatWave 4s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid Lines -->
  <g class="grid">
    <line x1="100" y1="0" x2="100" y2="320" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="320" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="320" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="320" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="320" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="320" class="grid-line" />

    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
  </g>

  <!-- Dynamic Actuarial Wave / Curve (Background Graphic) -->
  <g class="animated-wave" opacity="0.6">
    <path d="M 600,260 Q 750,120 900,200 T 1180,100 L 1180,320 L 600,320 Z" fill="url(#glowGrad)" />
    <path d="M 600,260 Q 750,120 900,200 T 1180,100" class="chart-line" />
    
    <!-- Data Points on Graphic -->
    <circle cx="750" cy="183" r="5" fill="#6366f1" />
    <circle cx="900" cy="200" r="5" fill="#8b5cf6" />
    <circle cx="1050" cy="138" r="5" fill="#ec4899" />
    <circle cx="1180" cy="100" class="pulse-circle" />
  </g>

  <!-- Decorative Metric Badges/Nodes in Right Background -->
  <g opacity="0.35" transform="translate(680, 50)">
    <rect x="0" y="0" width="140" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="15" y="30" font-family="monospace" font-size="14" fill="#38bdf8">f(x) = GLM(γ)</text>

    <rect x="160" y="40" width="150" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="175" y="70" font-family="monospace" font-size="14" fill="#a7f3d0">Rate +14.2%</text>
  </g>

  <!-- Foreground Main Title & Text Content -->
  <g transform="translate(70, 0)">
    <!-- Category Tag -->
    <text x="0" y="95" class="tag">⚡ Curated Actuarial &amp; Insurtech Resource</text>

    <!-- Main Title -->
    <text x="0" y="155" class="title">Awesome Insurance Rating Engine</text>

    <!-- Subtitle -->
    <text x="0" y="200" class="subtitle">SaaS Platforms, Open-Source Libraries &amp; Premium Calculation Automation</text>

    <!-- Decorative Accent Bar -->
    <rect x="0" y="225" width="240" height="4" rx="2" fill="url(#accentGrad)" />
  </g>
</svg>
